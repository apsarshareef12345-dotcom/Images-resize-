<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Image Resizer & Consistency Tool</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f3;color:#101820;font:15px Arial,sans-serif}.app{max-width:1160px;margin:34px auto;background:#fff;border:1px solid #c8d0d5;border-radius:12px;box-shadow:0 18px 45px #26323d25;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:19px 25px;border-bottom:1px solid #dce2e5}.top h1{font-size:22px;margin:0}.top button{border:0;background:#eef1f4;border-radius:8px;padding:9px 12px}.workspace{display:grid;grid-template-columns:1fr .82fr 1fr;gap:22px;padding:28px}.workspace h2{font-size:16px;margin:0 0 10px}.box{border:1px solid #c9d1d6;border-radius:7px;min-height:270px;background:#f7f9fa;overflow:hidden}.box img{width:100%;height:270px;object-fit:contain;display:none}.upload{height:270px;display:grid;place-content:center;text-align:center;color:#596871;padding:25px}.upload input{margin-top:14px;width:220px}.size{font-size:13px;text-align:center;margin:10px}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #b9c5cc;border-radius:7px;font:inherit}.field textarea{height:88px;resize:vertical}.presets{display:flex;flex-wrap:wrap;gap:6px}.presets button{border:1px solid #b9c5cc;background:#fff;border-radius:6px;padding:7px;cursor:pointer}.primary{width:100%;margin:14px 0;background:#126de7;color:#fff;border:0;border-radius:7px;padding:14px;font-weight:bold;font-size:14px;cursor:pointer}.primary:disabled{opacity:.5}.check{display:flex;gap:7px;font-size:13px}.actions{display:flex;gap:8px;justify-content:center}.actions a{display:none;text-decoration:none;background:#0e6e42;color:#fff;padding:9px 12px;border-radius:6px;font-weight:bold}.status{text-align:center;color:#58666e;font-size:13px;min-height:20px}@media(max-width:800px){.workspace{grid-template-columns:1fr}.app{margin:0;border-radius:0;min-height:100vh}.top h1{font-size:17px}}
</style></head><body><main class="app"><header class="top"><h1>AI Image Resizer & Consistency Tool</h1><div><button>↶ Undo</button> <button>↷ Redo</button> <button>▣ Save As</button></div></header><section class="workspace"><section><h2>Original Image</h2><div class="box"><div class="upload" id="upload"><b>Upload your original image</b><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></div><img id="original"></div><div class="size" id="inputSize">Input: —</div></section><section><h2>Output Dimensions</h2><div class="field"><label>Width</label><input id="width" type="number" value="1200" min="100"></div><div class="field"><label>Height</label><input id="height" type="number" value="1200" min="100"></div><div class="presets"><button data-size="1200,1200">1200×1200</button><button data-size="1200,628">1200×628</button><button data-size="1080,1080">1080×1080</button><button data-size="1080,1350">1080×1350</button></div><button class="primary" id="generate" disabled>RESIZE AND PRESERVE CONSISTENCY</button><label class="check"><input checked type="checkbox"> Maintain Scene & Text Consistency</label><div class="field"><textarea id="instruction">Keep the original image exactly the same. Generate only the missing background area for the selected output size.</textarea></div></section><section><h2>Resized Output</h2><div class="box"><div class="upload" id="empty">Your AI-generated output will appear here.</div><img id="output"></div><div class="size" id="outputSize">Output: —</div><div class="actions"><a id="png" download="expanded-image.png">Download PNG</a></div><div class="status" id="status"></div></section></section></main><script>
const $=id=>document.getElementById(id),file=$('file'),original=$('original'),output=$('output');let selected;
file.onchange=()=>{selected=file.files[0];if(!selected)return;const u=URL.createObjectURL(selected);original.src=u;original.style.display='block';$('upload').style.display='none';const i=new Image();i.onload=()=>{$('inputSize').textContent=`Input: ${i.width} × ${i.height} px`;$('generate').disabled=false};i.src=u};
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');$('width').value=w;$('height').value=h});
$('generate').onclick=async()=>{if(!selected)return;const w=$('width').value,h=$('height').value,btn=$('generate');btn.disabled=true;$('status').textContent='Generating matching background…';const f=new FormData();f.append('image',selected);f.append('width',w);f.append('height',h);try{const r=await fetch('/api/expand',{method:'POST',body:f});if(!r.ok)throw new Error((await r.json()).error);const blob=await r.blob(),url=URL.createObjectURL(blob);output.src=url;output.style.display='block';$('empty').style.display='none';$('png').href=url;$('png').style.display='inline-block';$('outputSize').textContent=`Output: ${w} × ${h} px`;$('status').textContent='Done.'}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};
</script></body></html>
